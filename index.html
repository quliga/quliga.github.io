<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Quliga Futbol Oyunu</title>
  <style>
    body { 
      background: linear-gradient(#0b6623, #228B22); 
      font-family: Arial, sans-serif; 
      color: white; 
      text-align: center;
    }
    .lobby {
      margin-top: 100px;
    }
    select, button {
      padding: 10px; 
      margin: 10px; 
      font-size: 16px;
    }
    #gameCanvas {
      display: none;
      margin: auto;
      background: #228B22;
      border: 3px solid white;
    }
  </style>
</head>
<body>
  <div class="lobby" id="lobby">
    <h1>Quliga Futbol Ligi</h1>
    <p>Takımını Seç:</p>
    <select id="teamSelect">
      <option>Akkağanlar SK</option>
      <option>Perşembe FK 1999</option>
      <option>Kekspor FK</option>
      <option>Adanaspor 01 FK</option>
      <option>Güneşspor</option>
      <option>Boztepe</option>
      <option>Horozspor</option>
      <option>Oyuncu Takımı</option>
    </select>
    <br>
    <p>Oyun Modu:</p>
    <select id="modeSelect">
      <option>Hızlı Maç</option>
      <option>Lig Maçı</option>
      <option>Turnuva</option>
    </select>
    <br>
    <button onclick="startGame()">Oyuna Başla</button>
  </div>

  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <script>
    function startGame() {
      const team = document.getElementById("teamSelect").value;
      const mode = document.getElementById("modeSelect").value;
      document.getElementById("lobby").style.display = "none";
      document.getElementById("gameCanvas").style.display = "block";
      alert(team + " ile " + mode + " başlıyor!");
      // Burada oyun motorunu başlatabilirsin
    }
  </script>
</body>
</html>
